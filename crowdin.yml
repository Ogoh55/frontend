# Crowdin sync for message catalogs (#116). See docs/i18n.md.
# English is the source; Crowdin writes translations back as messages/<locale>.json.
project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN
preserve_hierarchy: true
files:
  - source: /messages/en.json
    translation: /messages/%two_letters_code%.json
    # ICU MessageFormat: keeps {placeholders}, plurals and <tags> intact in the editor.
    type: json
    content_segmentation: 0
    # Vault surfaces (#221) are namespaced under `vault.*` in the same catalog so
    # they sync through this existing pipeline without colliding with the
    # options-chain keys. No separate source file is needed.
