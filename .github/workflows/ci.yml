name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref so each push only bills one run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege permissions; individual jobs add what they need.
permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write  # for posting VRT diff comments

env:
  # Required by Next.js env validation in src/env.ts at build time.
  # These are safe dummy values — nothing is deployed from CI.
  NEXT_PUBLIC_API_URL: http://localhost:8081
  NEXT_PUBLIC_STELLAR_NETWORK: testnet
  NEXT_PUBLIC_STELLAR_TESTNET_CONTRACT_ID: CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABSC4

# ─────────────────────────────────────────────────────────────────────────────
# LINT
# Runs next lint. Treats any warning as an error (--max-warnings 0).
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup
        # The composite action does: checkout → setup-node (from .nvmrc) → npm ci

      - name: Lint
        run: npm run lint:ci

  # ───────────────────────────────────────────────────────────────────────────
  # TYPECHECK
  # Runs tsc --noEmit against the project's tsconfig.json.
  # ───────────────────────────────────────────────────────────────────────────
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup

      - name: Typecheck
        run: npm run typecheck

  # ───────────────────────────────────────────────────────────────────────────
  # UNIT TESTS
  # Runs Jest with coverage; uploads the report so it's visible in the
  # GitHub Actions summary and can be picked up by third-party coverage
  # reporters (Codecov, Coveralls, etc.) if added later.
  # ───────────────────────────────────────────────────────────────────────────
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup

      - name: Run unit tests with coverage
        run: npm run test:ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # ───────────────────────────────────────────────────────────────────────────
  # BUILD
  # Runs `next build`. The .next/cache is restored between runs so
  # incremental builds are fast. The build artifact is uploaded so the
  # bundle workflow can analyse it without re-building.
  # ───────────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup

      # Restore the Next.js incremental build cache. Key includes a hash of
      # package-lock.json so the cache is invalidated when deps change.
      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nextjs-${{ runner.os }}-

      - name: Build
        run: npm run build

      # Upload the production build so the bundle job can measure it without
      # running next build a second time.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build-${{ github.sha }}
          path: |
            .next/
            !.next/cache
          retention-days: 1

  e2e:
    name: Playwright (desktop, iPhone 13, Pixel 7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npx playwright install --with-deps chromium webkit
      # RECORD=1 keeps a video of every test; they're uploaded below as the
      # PR's recordings of the tour, the mode switch and the phone trade flow.
      - run: npx playwright test
        env:
          CI: "true"
          RECORD: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14

  lighthouse:
    name: Lighthouse (mobile perf ≥ 0.85, CLS < 0.05)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx --yes @lhci/cli@0.14.0 autorun
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: lhci-report
          retention-days: 14

  # ────────────────────────────────────────────────────────────────────────────
  # Storybook: Build, test, visual regression, and publish
  # ────────────────────────────────────────────────────────────────────────────
  storybook-build:
    name: Build Storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        run: npm run storybook:build
        env:
          # Storybook needs a dummy env so Next.js env validation passes
          NEXT_PUBLIC_API_URL: http://localhost:8081
          NEXT_PUBLIC_NETWORK_LABEL: Testnet
          NEXT_PUBLIC_NETWORK_PASSPHRASE: 'Test SDF Network ; September 2015'
          NEXT_PUBLIC_CONTRACT_ID: CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABSC4

      - name: Upload Storybook build artifact
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-static/
          retention-days: 7

  storybook-test-runner:
    name: Test Runner (interactions + a11y)
    runs-on: ubuntu-latest
    needs: storybook-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download Storybook build
        uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: storybook-static/

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run Storybook test runner
        run: npm run storybook:test
        env:
          # Point the test runner at the static build served by the built-in
          # reference server.
          TARGET_URL: http://localhost:6006

  # ────────────────────────────────────────────────────────────────────────────
  # POST-DEPLOY VERIFICATION (issue #288)
  # Read-only smoke suite + canary gate for vault contract/backend releases.
  # Runs only when a deployed environment URL is provided (e.g. via a
  # workflow_dispatch input or a release event). Never submits transactions.
  # ────────────────────────────────────────────────────────────────────────────
  post-deploy-verify:
    name: Post-deploy verification (smoke + canary)
    runs-on: ubuntu-latest
    # Only run when a target environment is supplied; skip on plain PRs.
    if: ${{ vars.DEPLOY_ENV_URL != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Read-only smoke suite: registry, NAV/share price, simulated deposit &
      # withdrawal, epoch ledger entry, and indexer ledger-lag bound. Fails the
      # job (triggering rollback) if any check fails.
      - name: Run post-deploy smoke suite
        run: npm run verify:smoke
        env:
          DEPLOY_ENV_URL: ${{ vars.DEPLOY_ENV_URL }}
          CANARY_BASE_URL: ${{ vars.CANARY_BASE_URL }}
          INDEXER_MAX_LAG_LEDGERS: ${{ vars.INDEXER_MAX_LAG_LEDGERS || '30' }}
          VERIFY_RELEASE: ${{ github.ref_name }}

      # Canary gate: percentage/shadow traffic with structural comparison of
      # responses to the stable version; promotes only when error rate and
      # latency are within budget.
      - name: Run canary comparison gate
        run: npm run verify:canary
        env:
          DEPLOY_ENV_URL: ${{ vars.DEPLOY_ENV_URL }}
          CANARY_BASE_URL: ${{ vars.CANARY_BASE_URL }}
          CANARY_ERROR_BUDGET: ${{ vars.CANARY_ERROR_BUDGET || '0.01' }}
          CANARY_LATENCY_BUDGET_MS: ${{ vars.CANARY_LATENCY_BUDGET_MS || '500' }}
          VERIFY_RELEASE: ${{ github.ref_name }}

      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-deploy-verification-${{ github.ref_name }}
          path: verification-results/
          retention-days: 30

      # Automatic rollback when any gate fails. Manual override is documented
      # in docs/DEPLOY_ROLLBACK.md (set ROLLBACK_OVERRIDE=true to skip).
      - name: Automatic rollback on gate failure
        if: failure() && vars.ROLLBACK_OVERRIDE != 'true'
        run: npm run deploy:rollback
        env:
          DEPLOY_ENV_URL: ${{ vars.DEPLOY_ENV_URL }}
          VERIFY_RELEASE: ${{ github.ref_name }}
